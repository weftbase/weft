name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Support policy: current Go release and N-1 (go.mod pins the
        # minimum). See README "Development".
        go-version: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      # The framework module, the core module and the examples (ADR
      # 0027): loop over the workspace the same way `make test` does. The live suite is never in CI — no
      # keys; it is a release-time manual step.
      - name: vet (every module)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && go vet ./...)
          done
      - name: test (every module)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && go test -race -timeout 20m ./...)
          done
      - name: build (every module)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && go build ./...)
          done

  # The layering guard (scripts/check-layering.sh): no package of the
  # workspace, tests included, imports the platform
  # (github.com/weftbase/weftbase).
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: layering (framework never imports the platform)
        run: scripts/check-layering.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      # golangci-lint per module, all sharing the root .golangci.yml.
      # Pinned so lint results do not drift with HEAD (staticcheck's
      # rule set changes between minor versions). v2.14.0: v2.13.2's
      # x/tools reads export data up to version 4, and Go 1.27.2 (the
      # stable this job sets up) writes version 5 — every import failed
      # "could not load export data". Bump it when `stable` moves past
      # what the pinned release reads (the Makefile's lint names it too).
      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.14.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
      - name: lint (every module)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml")
          done

  # The selvedge (TODO §1.7): every module go.work lists is compared
  # against its own last tag under the policy scripts/apidiff.sh
  # records for it — core fails on an incompatible change unless it is
  # acknowledged in core/.apidiff-allow (pre-1.0 only); the root, which
  # holds the pre-freeze layers, reports without failing; examples
  # skip. A module without a policy fails.
  apidiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to find the base
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      # Pinned, like golangci-lint in the lint job, so gate results do not drift
      # with HEAD.
      - name: install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260908205506-85c1c2202aba
      # The gate must fail closed: exercise its own failure modes (a
      # non-compiling tree, an incompatible rename) before trusting it.
      - name: apidiff self-test (the gate fails closed)
        run: scripts/apidiff-selftest.sh
      - name: apidiff (every workspace module vs its last tag)
        run: scripts/apidiff.sh "" all

  # The offline gate (ADR 0013's kill-switch clause): the whole
  # workspace stays green under WEFT_MODEL_REQUESTS=deny — suites that
  # must never reach the network get loud failures, not silent egress.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: test (every module, WEFT_MODEL_REQUESTS=deny)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && WEFT_MODEL_REQUESTS=deny go test ./...)
          done

  # The fuzz gate (TODO §9.4): every Fuzz* target of the core module
  # and of thread's decoders runs for FUZZTIME on
  # stable Go. Not under -race (the seeds already run under -race in
  # `test`). A crasher fails the job and its input is uploaded so the
  # fix PR can commit it as a seed.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: fuzz (core module, 10s per target)
        run: make fuzz
      - name: fuzz (thread package, 10s per target)
        run: make fuzz-thread
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: |
            core/testdata/fuzz
            thread/testdata/fuzz
          if-no-files-found: ignore

